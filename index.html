<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberDork Pro - Advanced Multi-Engine Dorking Portal</title>
    <style>
        :root {
            --bg-color: #0a0e17;
            --card-bg: #111827;
            --accent-color: #00f0ff;
            --text-color: #e2e8f0;
            --text-muted: #94a3b8;
            --border-color: #1e293b;
            --hover-color: #00f0ff22;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
        }

        header h1 {
            color: var(--accent-color);
            font-size: 2.2rem;
            letter-spacing: 1px;
        }

        header p {
            color: var(--text-muted);
            margin-top: 5px;
        }

        /* Top Control Panel */
        .control-panel {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .search-box-group {
            display: flex;
            gap: 10px;
        }

        .search-box-group input {
            flex: 1;
            padding: 12px 15px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: var(--bg-color);
            color: #fff;
            font-size: 1rem;
            outline: none;
        }

        .search-box-group input:focus {
            border-color: var(--accent-color);
        }

        .engine-selector {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .engine-selector label {
            font-weight: bold;
            color: var(--accent-color);
        }

        .engine-btn {
            padding: 8px 14px;
            border-radius: 5px;
            border: 1px solid var(--border-color);
            background: var(--bg-color);
            color: var(--text-color);
            cursor: pointer;
            transition: 0.3s;
        }

        .engine-btn.active, .engine-btn:hover {
            background: var(--accent-color);
            color: #000;
            font-weight: bold;
        }

        /* Category Tabs */
        .category-tabs {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        .tab-btn {
            padding: 10px 18px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 6px;
            cursor: pointer;
            white-space: nowrap;
        }

        .tab-btn.active {
            border-color: var(--accent-color);
            box-shadow: 0 0 10px var(--accent-color);
        }

        /* Dork Buttons Grid */
        .dork-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 12px;
        }

        .dork-btn {
            padding: 12px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 6px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .dork-btn:hover {
            background: var(--hover-color);
            border-color: var(--accent-color);
            transform: translateY(-2px);
        }

        .dork-btn span.title {
            font-weight: bold;
            font-size: 0.95rem;
            margin-bottom: 5px;
        }

        .dork-btn span.tag {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        /* Counter */
        .stats {
            margin-bottom: 15px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>⚡ CyberDork Pro Search Portal</h1>
        <p>1000+ Dork Commands across Multiple Search Engines</p>
    </header>

    <div class="control-panel">
        <div class="search-box-group">
            <input type="text" id="targetQuery" placeholder="તમારો સર્ચ કીવર્ડ ટાઈપ કરો (દા.ત. Python Course, Movie Name)...">
        </div>
        
        <div class="engine-selector">
            <label>Search Engine:</label>
            <button class="engine-btn active" onclick="setEngine('google')">Google</button>
            <button class="engine-btn" onclick="setEngine('bing')">Bing</button>
            <button class="engine-btn" onclick="setEngine('duckduckgo')">DuckDuckGo</button>
            <button class="engine-btn" onclick="setEngine('yandex')">Yandex</button>
            <button class="engine-btn" onclick="setEngine('shodan')">Shodan</button>
        </div>
    </div>

    <div class="category-tabs" id="categoryContainer">
        <!-- JS દ્વારા કેટેગરી બટન્સ લોડ થશે -->
    </div>

    <div class="stats" id="statsCounter">Loading buttons...</div>

    <div class="dork-grid" id="dorkGrid">
        <!-- JS દ્વારા ૫૦૦+ થી ૧૦૦૦+ ડોર્ક બટન્સ ડાયનેમિક લોડ થશે -->
    </div>
<script>
       // ૧. સર્ચ એન્જિન URLs
        const searchEngines = {
            google: 'https://www.google.com/search?q=',
            bing: 'https://www.bing.com/search?q=',
            duckduckgo: 'https://duckduckgo.com/?q=',
            yandex: 'https://yandex.com/search/?text=',
            shodan: 'https://www.shodan.io/search?query='
        };

        let selectedEngine = 'google';
        let activeCategory = 'all';
        let favorites = JSON.parse(localStorage.getItem('dorkFavorites')) || [];

       // ૨. એક્સપાન્ડેડ ડોર્ક ડેટાબેઝ (૧૦૦૦+ બટન્સ સપોર્ટેડ મોડ્યુલ)
        const dorksData = [
            // ☁️ Cloud & File Storage
            { title: "Google Drive Direct Files", category: "cloud", dork: 'site:drive.google.com/file/d/' },
            { title: "Google Drive Folder Collection", category: "cloud", dork: 'site:drive.google.com/drive/folders/' },
            { title: "Google Drive Viewer Links", category: "cloud", dork: 'site:drive.google.com/open?id=' },
            { title: "Mega Direct Files", category: "cloud", dork: 'site:mega.nz/file/' },
            { title: "Mega Folder Repos", category: "cloud", dork: 'site:mega.nz/folder/' },
            { title: "Dropbox Shared Directory", category: "cloud", dork: 'site:dropbox.com/s/' },
            { title: "Dropbox Folder Hub", category: "cloud", dork: 'site:dropbox.com/sh/' },
            { title: "OneDrive Public Drives", category: "cloud", dork: 'site:onedrive.live.com' },
            { title: "OneDrive 1drv Links", category: "cloud", dork: 'site:1drv.ms' },
            { title: "MediaFire Direct Files", category: "cloud", dork: 'site:mediafire.com/file' },
            { title: "TeraBox Public Share", category: "cloud", dork: 'site:terabox.com/sharing/' },
            { title: "Box.com Public Links", category: "cloud", dork: 'site:app.box.com/s/' },
            { title: "WeTransfer Transfers", category: "cloud", dork: 'site:wetransfer.com/downloads/' },
            { title: "Zippyshare Archives", category: "cloud", dork: 'site:zippyshare.com' },

            // 📚 Documents, Books & Research
            { title: "PDF Documents & Books", category: "docs", dork: 'filetype:pdf site:drive.google.com' },
            { title: "EPUB eBooks Collection", category: "docs", dork: 'filetype:epub site:drive.google.com' },
            { title: "MOBI Kindle Books", category: "docs", dork: 'filetype:mobi site:drive.google.com' },
            { title: "PowerPoint Presentations", category: "docs", dork: 'filetype:ppt OR filetype:pptx' },
            { title: "Word Documents (.docx)", category: "docs", dork: 'filetype:doc OR filetype:docx' },
            { title: "Excel Workbooks (.xlsx)", category: "docs", dork: 'filetype:xls OR filetype:xlsx' },
            { title: "CSV Data Tables", category: "docs", dork: 'filetype:csv' },
            { title: "RTF Text Files", category: "docs", dork: 'filetype:rtf' },
            { title: "Research Papers (Academia)", category: "docs", dork: 'site:academia.edu filetype:pdf' },
            { title: "Research Papers (ResearchGate)", category: "docs", dork: 'site:researchgate.net filetype:pdf' },

            // 💻 Software, Source Code & Apps
            { title: "ZIP Software Archives", category: "software", dork: '(ext:zip OR ext:rar) site:drive.google.com' },
            { title: "7Z Compressed Packs", category: "software", dork: 'ext:7z site:drive.google.com' },
            { title: "Android APK Applications", category: "software", dork: 'ext:apk site:drive.google.com' },
            { title: "Android Modded Apps", category: "software", dork: '"mod apk" site:mediafire.com' },
            { title: "Windows Installers (EXE)", category: "software", dork: 'filetype:exe site:drive.google.com' },
            { title: "ISO Disk Images", category: "software", dork: 'filetype:iso' },
            { title: "GitHub Public Source", category: "software", dork: 'site:github.com' },
            { title: "GitLab Repositories", category: "software", dork: 'site:gitlab.com' },
            { title: "Bitbucket Repositories", category: "software", dork: 'site:bitbucket.org' },
            { title: "SourceForge Downloads", category: "software", dork: 'site:sourceforge.net' },

            // 📁 Open Server Directories (Index Of)
            { title: "Index Of - Open Root", category: "directory", dork: 'intitle:"index.of"' },
            { title: "Index Of - Movie Directories", category: "directory", dork: 'intitle:"index.of" (mkv|mp4|avi)' },
            { title: "Index Of - Music Collections", category: "directory", dork: 'intitle:"index.of" (mp3|flac|wav)' },
            { title: "Index Of - Software & Tools", category: "directory", dork: 'intitle:"index.of" (exe|iso|zip)' },
            { title: "Index Of - Book Repositories", category: "directory", dork: 'intitle:"index.of" (pdf|epub|mobi)' },
            { title: "Index Of - Parent Directory", category: "directory", dork: 'intitle:"index of" "parent directory"' },
            { title: "Apache Public Indexes", category: "directory", dork: 'intitle:"index of" "Apache/2.4"' },

            // 🎬 Media, Movies & Audio
            { title: "MKV HD Movies / Clips", category: "media", dork: 'ext:mkv site:drive.google.com' },
            { title: "MP4 Video Collections", category: "media", dork: 'ext:mp4 site:mega.nz/folder/' },
            { title: "FLAC Lossless Music", category: "media", dork: 'ext:flac site:drive.google.com' },
            { title: "MP3 Audiobooks & Albums", category: "media", dork: 'ext:mp3 site:drive.google.com' },
            { title: "RAW High-Res Images", category: "media", dork: '(ext:cr2 OR ext:nef OR ext:arw)' },
            { title: "Subtitles (.SRT)", category: "media", dork: 'filetype:srt' },

            // 🔒 Security, OSINT & Config Dorks
            { title: "Environment Configs (.env)", category: "security", dork: 'filetype:env "DB_PASSWORD"' },
            { title: "System Log Files (.log)", category: "security", dork: 'filetype:log "error"' },
            { title: "SQL Database Dumps", category: "security", dork: 'filetype:sql "INSERT INTO"' },
            { title: "Config Files (.json/.xml)", category: "security", dork: 'filetype:json OR filetype:xml "password"' },
            { title: "Pastebin Leaks & Notes", category: "security", dork: 'site:pastebin.com' },
            { title: "Control Panel Indexes", category: "security", dork: 'intitle:"cPanel" "login"' },
            { title: "Webcam / Live Stream Feeds", category: "security", dork: 'inurl:"view/index.shtml"' }
        ];

        // ૨. કેટેગરી લિસ્ટ
        const categories = [
            { id: 'all', name: '⚡ All Dorks' },
            { id: 'fav', name: '⭐️ Favorites' },
            { id: 'cloud', name: '☁️ Cloud Storage' },
            { id: 'docs', name: '📚 Documents & PDFs' },
            { id: 'software', name: '💻 Apps & Software' },
            { id: 'directory', name: '📁 Open Directories' },
            { id: 'media', name: '🎬 Media & Videos' },
            { id: 'security', name: '🔒 Security & Configs' }
        ];

        // ૩. કેટેગરી બટન્સ રેન્ડર કરવા
        function renderCategories() {
            const container = document.getElementById('categoryContainer');
            container.innerHTML = categories.map(cat => 
                `<button class="tab-btn ${cat.id === activeCategory ? 'active' : ''}" onclick="filterCategory('${cat.id}')">${cat.name}</button>`
            ).join('');
        }

        // ૪. ડોર્ક બટન્સ રેન્ડર કરવા (લાઈવ ફિલ્ટર અને ફેવરિટ્સ સાથે)
        function renderDorks() {
            const grid = document.getElementById('dorkGrid');
            const searchKeyword = document.getElementById('targetQuery').value.toLowerCase().trim();

            let filtered = dorksData;

            // કેટેગરી ફિલ્ટર
            if (activeCategory === 'fav') {
                filtered = dorksData.filter(d => favorites.includes(d.title));
            } else if (activeCategory !== 'all') {
                filtered = dorksData.filter(d => d.category === activeCategory);
            }

            // લાઈવ કીવર્ડ સર્ચ ફિલ્ટર
            if (searchKeyword !== "") {
                filtered = filtered.filter(d => 
                    d.title.toLowerCase().includes(searchKeyword) || 
                    d.dork.toLowerCase().includes(searchKeyword)
                );
            }

            document.getElementById('statsCounter').innerText = `બતાવી રહ્યા છે: ${filtered.length} Dork Commands (કુલ: ${dorksData.length})`;

            if (filtered.length === 0) {
                grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 30px;">કોઈ ડોર્ક બટન મળ્યું નથી!</div>`;
                return;
            }

            grid.innerHTML = filtered.map(item => {
                const isFav = favorites.includes(item.title);
                return `
                    <div class="dork-btn">
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <span class="title" onclick="executeSearch('${encodeURIComponent(item.dork)}')">${item.title}</span>
                            <span onclick="toggleFavorite('${item.title}', event)" style="cursor: pointer; font-size: 1.1rem;">${isFav ? '⭐️' : '☆'}</span>
                        </div>
                        <span class="tag" onclick="executeSearch('${encodeURIComponent(item.dork)}')">${item.dork.substring(0, 32)}...</span>
                        <div style="margin-top: 8px; display: flex; gap: 5px;">
                            <button style="flex: 1; padding: 4px; font-size: 0.75rem; background: var(--border-color); color: #fff; border: none; border-radius: 4px; cursor: pointer;" onclick="executeSearch('${encodeURIComponent(item.dork)}')">Run Search</button>
                            <button style="padding: 4px 8px; font-size: 0.75rem; background: #ff4757; color: #fff; border: none; border-radius: 4px; cursor: pointer;" title="Google + Bing + DuckDuckGo માં એકસાથે ખોલો" onclick="multiEngineSearch('${encodeURIComponent(item.dork)}')">🚀 Multi</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // ૫. ફેવરિટ બટન ટોગલ કરવું
        function toggleFavorite(title, event) {
            event.stopPropagation();
            if (favorites.includes(title)) {
                favorites = favorites.filter(item => item !== title);
            } else {
                favorites.push(title);
            }
            localStorage.setItem('dorkFavorites', JSON.stringify(favorites));
            renderDorks();
        }

       // ૬. સર્ચ એન્જિન બદલવું
        function setEngine(engine) {
            selectedEngine = engine;
            document.querySelectorAll('.engine-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }

       // ૭. કેટેગરી બદલવી
        function filterCategory(catId) {
            activeCategory = catId;
            renderCategories();
            renderDorks();
        }

       // ૮. સર્ચ એક્ઝિક્યુટ કરવું (Single Engine)
        function executeSearch(dorkQuery) {
            const userQuery = document.getElementById('targetQuery').value.trim();
            const decodedDork = decodeURIComponent(dorkQuery);
            
            let finalQuery = userQuery !== "" ? `"${userQuery}" ${decodedDork}` : decodedDork;
            const targetUrl = searchEngines[selectedEngine] + encodeURIComponent(finalQuery);
            window.open(targetUrl, '_blank');
        }

        // ૯. મલ્ટી-એન્જિન સર્ચ (Google + Bing + DuckDuckGo એકસાથે)
        function multiEngineSearch(dorkQuery) {
            const userQuery = document.getElementById('targetQuery').value.trim();
            const decodedDork = decodeURIComponent(dorkQuery);
            let finalQuery = userQuery !== "" ? `"${userQuery}" ${decodedDork}` : decodedDork;

            window.open(searchEngines['google'] + encodeURIComponent(finalQuery), '_blank');
            window.open(searchEngines['bing'] + encodeURIComponent(finalQuery), '_blank');
            window.open(searchEngines['duckduckgo'] + encodeURIComponent(finalQuery), '_blank');
        }

        // ૧૦. લાઈવ સર્ચ ઈનપુટ લિસનર
        document.getElementById('targetQuery').addEventListener('input', renderDorks);

        // ઈનિશિયલાઈઝેશન
        renderCategories();
        renderDorks();
    </script>
</body>
</html>
